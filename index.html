<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planer maturalny</title>
<meta name="description" content="Interaktywny planer maturalny: odliczanie do matury, postęp z podstawy programowej, powtórki i lista lektur.">
<meta name="color-scheme" content="light dark">
<script>
  // Motyw ustawiany przed pierwszym malowaniem, żeby nie było mignięcia jasnym tłem.
  try {
    var t = (JSON.parse(localStorage.getItem('matura-planner-v1') || '{}').theme) || 'auto';
    document.documentElement.dataset.theme =
      t === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
  } catch (e) {}
</script>
<link rel="stylesheet" href="styles/ds.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="page">
  <main class="wrap">

    <header class="top">
      <span class="kicker">Planer maturalny</span>
      <div class="top-tools">
        <span class="kicker">Matura <span id="exam-year">—</span></span>
        <button type="button" class="tool-btn" id="theme-btn">Motyw: auto</button>
      </div>
    </header>

    <section class="countdown">
      <div class="countdown-days" id="days">—</div>
      <div class="countdown-label">dni do matury</div>
      <div class="countdown-clock"><span id="hours">--</span> : <span id="minutes">--</span> : <span id="seconds">--</span></div>
    </section>

    <section class="stats">
      <div class="stat">
        <div class="stat-value" id="overall-pct">0%</div>
        <div class="stat-label">postęp ogółem</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="done-total">0</div>
        <div class="stat-label">opanowane punkty</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="arkusze-total">0 / 0</div>
        <div class="stat-label">arkusze</div>
      </div>
    </section>

    <section class="today">
      <div class="today-head">
        <span class="kicker">Dziś</span>
        <span class="today-streak" id="streak"></span>
      </div>
      <div class="today-pace" id="pace"></div>
      <div class="today-milestone" id="milestone"></div>
      <div class="today-week">
        <div class="today-week-label" id="week-label"></div>
        <div class="bar"><div class="bar-fill is-ink" id="week-bar" style="width:0%"></div></div>
      </div>
      <div id="today-lists"></div>
    </section>

    <nav class="subjects" id="subjects" role="tablist" aria-label="Przedmioty"></nav>

    <section class="panel">
      <div class="panel-head">
        <h2 class="panel-title" id="panel-title">—</h2>
        <span class="panel-meta" id="panel-meta"></span>
      </div>
      <div class="bar"><div class="bar-fill" id="panel-bar" style="width:0%"></div></div>

      <div class="subtabs" id="subtabs" role="tablist" aria-label="Widok przedmiotu"></div>

      <div id="panel-body"></div>
    </section>

    <p class="footnote">Postęp zapisuje się automatycznie w tej przeglądarce.</p>
  </main>
</div>

<script src="js/data-dzialy.js"></script>
<script src="js/data-listy.js"></script>
<script src="js/app.js"></script>
</body>
</html>
